name: Release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    # Must match the trusted publisher registered on PyPI.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Check the tag matches the package version
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - run: uv build
      - name: Run the built wheel
        run: uv run --isolated --no-project --with dist/*.whl tracewash status
      - run: uv publish
